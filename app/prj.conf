# Logging
CONFIG_LOG=y

# Input (SW2/SW3 gpio-keys)
CONFIG_INPUT=y

# Display
CONFIG_DISPLAY=y
# MIPI_DBI is auto-enabled by the driver; suppress NCS's WARN_EXPERIMENTAL to avoid build abort
CONFIG_WARN_EXPERIMENTAL=n

# LVGL
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y
# Default (2048) is far too small for the SquareLine screens (theme + components +
# fonts); the stock LVGL demos sample needed ~58KB for a similar widget count
CONFIG_LV_Z_MEM_POOL_SIZE=28672

# Peripheral simulations
CONFIG_TILT_SIM=y
CONFIG_ENV_SIM=y

CONFIG_EVENTS=y

# Input (gpio-keys) processing runs on its own thread, separate from the
# system workqueue that submits raw events to it, and defaults to
# K_LOWEST_APPLICATION_THREAD_PRIO -- far below CONFIG_UI_THREAD_PRIORITY (5).
# The submit side never blocks (K_NO_WAIT), so under a burst of presses, if
# the (higher-priority) UI thread doesn't yield long/often enough for input's
# thread to drain the queue, new events are silently dropped before they ever
# reach ui_manager_input_cb -- looks exactly like a dead button, not a queue
# overflow. Override it above the UI thread so it always preempts UI work.
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=4

# Enable MQ custom driver
CONFIG_MQ=y